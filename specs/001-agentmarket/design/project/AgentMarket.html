<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentMarket — live demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Hanken Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Space Grotesk", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "ui-monospace", "monospace"],
          },
          colors: {
            ink: "#0A0B0F",
            panel: "#0F1117",
            panel2: "#15171F",
            edge: "#21242F",
            mut: "#888FA3",
            txt: "#E9EBF2",
            acc: "#2EE6E6",
            grn: "#35D399",
            amber: "#F5B544",
            red: "#FF5C72",
          },
          keyframes: {
            blink: { "0%,49%": { opacity: "1" }, "50%,100%": { opacity: "0" } },
            livepulse: {
              "0%": { boxShadow: "0 0 0 0 rgba(46,230,230,0.55)", opacity: "1" },
              "70%": { boxShadow: "0 0 0 6px rgba(46,230,230,0)", opacity: ".7" },
              "100%": { boxShadow: "0 0 0 0 rgba(46,230,230,0)", opacity: "1" },
            },
            shimmer: { "0%": { opacity: ".45" }, "50%": { opacity: ".9" }, "100%": { opacity: ".45" } },
            popin: { "0%": { transform: "scale(.6)", opacity: "0" }, "60%": { transform: "scale(1.12)" }, "100%": { transform: "scale(1)", opacity: "1" } },
          },
          animation: {
            blink: "blink 1s steps(1) infinite",
            livepulse: "livepulse 1.6s ease-out infinite",
            shimmer: "shimmer 1.3s ease-in-out infinite",
            popin: "popin .5s cubic-bezier(.2,1.3,.4,1) both",
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #0A0B0F; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #21242F; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    #boot-msg { font-family: "JetBrains Mono", monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "lucide-react": "https://esm.sh/lucide-react@0.462.0?external=react"
      }
    }
  </script>
</head>
<body class="bg-ink">
  <div id="agentmarket-root"></div>
  <div id="boot" class="fixed inset-0 grid place-items-center text-[#888FA3]">
    <div id="boot-msg" class="text-sm">booting AgentMarket<span style="color:#2EE6E6">_</span></div>
  </div>

  <script type="module">
    import * as Babel from "https://esm.sh/@babel/standalone@7.26.4";

    async function boot() {
      try {
        const src = await (await fetch("AgentMarket.tsx", { cache: "no-store" })).text();
        const { code } = Babel.transform(src, {
          filename: "AgentMarket.tsx",
          sourceType: "module",
          presets: [
            ["typescript", { isTSX: true, allExtensions: true, allowDeclareFields: true }],
            ["react", { runtime: "classic" }],
          ],
        });
        const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
        await import(url);
        const boot = document.getElementById("boot");
        if (boot) boot.remove();
      } catch (err) {
        console.error(err);
        const el = document.getElementById("boot-msg");
        if (el) {
          el.style.color = "#FF5C72";
          el.textContent = "boot error: " + (err && err.message ? err.message : String(err));
        }
      }
    }
    boot();
  </script>
</body>
</html>
